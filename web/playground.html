<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photo Relighting — Playground</title>
  <link rel="stylesheet" href="playground.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>Photo Relighting</h1>
    <input type="text" id="scene-name" placeholder="Untitled scene" />
    <button id="new-scene-btn" type="button">+ New Scene</button>
    <button id="scenes-btn" type="button">Scenes</button>
    <span class="header-status" id="save-status"></span>
    <span class="header-spacer"></span>
    <label class="header-toggle">
      <input type="checkbox" id="show-anchors" checked /> Anchors
    </label>
    <button id="refine-mask-btn" type="button" class="refine-toggle">Refine Mask</button>
    <button id="refine-clear-btn" type="button" hidden>Clear points</button>
    <button id="export-btn" type="button">Export PNG</button>
    <button id="toggle-3d-btn" type="button" title="Show or hide the 3D viewport">Hide 3D</button>
    <div class="polish-controls" data-polish-controls hidden>
      <div class="polish-toggle" data-polish-toggle hidden>
        <button type="button" data-polish-toggle-classical class="is-active">Classical</button>
        <button type="button" data-polish-toggle-polished>Polished</button>
      </div>
      <input
        type="text"
        placeholder="Polish prompt (optional)"
        class="polish-prompt"
        data-polish-prompt
      />
      <button type="button" class="polish-btn" data-polish-btn>Polish ▸</button>
    </div>
    <label class="theme-toggle" title="Toggle light/dark theme">
      <input type="checkbox" id="theme-switch" />
      <span class="theme-track"><span class="theme-thumb"></span></span>
    </label>
  </header>

  <main>
    <aside id="tree-pane">
      <div class="pane-header">
        <h2>Lights</h2>
        <div class="pane-actions">
          <button id="add-light-btn" type="button" title="Add light">+ Light</button>
          <button id="add-group-btn" type="button" title="Add group">+ Group</button>
        </div>
      </div>
      <ul id="tree-root"></ul>
    </aside>

    <section id="stage">
      <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="handles"></div>
        <div id="refine-overlay" hidden></div>
        <div class="polish-shimmer" data-polish-shimmer hidden>
          <span class="polish-shimmer-text" data-polish-shimmer-text>Polishing…</span>
        </div>
        <button
          type="button"
          class="polish-expand-btn"
          data-polish-expand-btn
          title="Open polished image"
          hidden
        >⤢</button>
      </div>
      <div class="stage-divider" id="stage-divider"></div>
      <div id="stage3d-wrap">
        <canvas id="canvas3d"></canvas>
        <div class="stage3d-overlay" id="stage3d-overlay"></div>
      </div>
    </section>

    <aside id="props-pane">
      <div id="props-content"></div>
    </aside>
  </main>

  <div class="polish-lightbox" data-polish-lightbox role="dialog" aria-hidden="true">
    <button type="button" class="polish-lightbox-close" data-polish-lightbox-close aria-label="Close">×</button>
    <img class="polish-lightbox-img" data-polish-lightbox-img alt="Polished render" />
    <div class="polish-lightbox-actions">
      <button type="button" data-polish-lightbox-download-png>Download PNG</button>
      <button type="button" data-polish-lightbox-download-jpeg>Download JPEG</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
